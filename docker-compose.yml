version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: bustracker-db
    environment:
      POSTGRES_USER: bustracker
      POSTGRES_PASSWORD: bustracker123
      POSTGRES_DB: bustracker
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
